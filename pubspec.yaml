name: quarkbau_mobile
description: A new Flutter project for QuarkBau mobile equivalent
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^12.1.1
  google_fonts: ^6.1.0
  google_maps_flutter: ^2.5.3
  image_picker: ^1.1.2
  sqflite: ^2.3.0
  path: ^1.9.0
  camera: ^0.10.5+9
  geolocator: ^11.1.0
  speech_to_text: ^7.4.0
  tailwind_colors: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
